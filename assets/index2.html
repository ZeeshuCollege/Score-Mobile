<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta-tags -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap - 5.0.1 -->
  <link rel="stylesheet" href="./bootstrap-5.0.1-dist/css/bootstrap.min.css" />
  <script src="./bootstrap-5.0.1-dist/js/bootstrap.min.js"></script>

  <!-- CSS -->
  <link href="./css/styles.css" rel="stylesheet">

  <!-- MathJax -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ["\\(", "\\)"]],
        processEscapes: true
      }
    };
  </script>
  <script id="MathJax-script" type="text/javascript" src="./mathjax/es5/tex-mml-chtml.js" async></script>
</head>

<body>

  <!-- Overall app container -->
  <section class="container-fluid">

    <!-- Container for question text -->
    <section class="row">
      <p id="questionText"></p>
    </section>

    <!-- Container for labels -->
    <section id="labelBox" class="row">

      <!-- Left-side-actions -->
      <div class="labels-left col-md-6 col-12"></div>

      <!-- Right-side-actions -->
      <div class="labels-right col-md-6 col-12 justify-content-end">
        <div id="action-show-solutions" class="label-text">
          Show Solutions
        </div>
      </div>
    </section>

    <!-- Container for options -->
    <section id="optionsBox"></section>

    <!-- Container for solutions -->
    <section id="solutionBox">
      <div class="row">
        <p class="solution-header">Solution:</p>
      </div>

      <div class="row">
        <p class="solution-text"></p>
      </div>
    </section>

    <!-- Container for report-error -->
    <section id="error" class="row">
      <div class="error-container">
        <object class="error-icon" data="assets/svg/Vector.svg" width="30" height="30"></object>

        <span class="error-text">
          Report Error
        </span>
      </div>
    </section>
  </section>

  <br><br>
  <div id="submit"><button>SUBMIT</button></div>

  <!-- Script Files -->
  <script src="./js/index.js"></script>
</body>

</html>
